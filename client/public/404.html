<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Steampunk Cleaning</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #eef6f8 100%);
        color: #3d5266;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 3.5rem;
        line-height: 1;
        color: #1a9e8f;
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.35rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.75rem;
        line-height: 1.6;
        color: #5b6b7c;
      }
      a {
        display: inline-block;
        background: #1a9e8f;
        color: #fff;
        text-decoration: none;
        padding: 0.85rem 1.4rem;
        border-radius: 0.5rem;
        font-weight: 600;
      }
      a:hover { background: #168577; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Sorry, the page you are looking for doesn't exist. It may have been moved or deleted.</p>
      <a href="/">Go Home</a>
    </main>
  </body>
</html>
