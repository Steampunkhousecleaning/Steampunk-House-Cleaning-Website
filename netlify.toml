[build]
  # Vite client build + headless prerender of SEO routes into dist/public
  command = "pnpm exec puppeteer browsers install chrome && vite build && node scripts/prerender.mjs"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  # Ensure puppeteer can install/use Chrome during Netlify builds
  PUPPETEER_CACHE_DIR = "/opt/buildhome/.cache/puppeteer"

# Prerender writes route HTML as pretty paths:
#   / -> index.html
#   /about -> about/index.html
# Netlify serves those static files first (no force redirects).
# Unknown paths still get a real HTTP 404 via 404.html.
# Client-side wouter routing continues to work after JS loads.


# Legacy WordPress / trailing-slash URLs → SPA routes
[[redirects]]
  from = "/locations/"
  to = "/locations"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/los-angeles/"
  to = "/locations/los-angeles-orange-county"
  status = 301
  force = true

[[redirects]]
  from = "/los-angeles"
  to = "/locations/los-angeles-orange-county"
  status = 301
  force = true

[[redirects]]
  from = "/pasadena-ca-home-cleaning-services/"
  to = "/locations/los-angeles-orange-county/pasadena"
  status = 301
  force = true

[[redirects]]
  from = "/pasadena-ca-home-cleaning-services"
  to = "/locations/los-angeles-orange-county/pasadena"
  status = 301
  force = true

[[redirects]]
  from = "/long-beach-ca-home-cleaning-services/"
  to = "/locations/los-angeles-orange-county/long-beach"
  status = 301
  force = true

[[redirects]]
  from = "/long-beach-ca-home-cleaning-services"
  to = "/locations/los-angeles-orange-county/long-beach"
  status = 301
  force = true

[[redirects]]
  from = "/long-beach-ca-house-cleaning-services/"
  to = "/locations/los-angeles-orange-county/long-beach"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
